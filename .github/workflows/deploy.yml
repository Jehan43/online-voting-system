
name: Deploy Voting Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: voting-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: voting-frontend
        run: npm ci

      - name: Build frontend
        working-directory: voting-frontend
        run: npm run build

      - name: Generate runtime configuration
        working-directory: voting-frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          printf 'window.APP_CONFIG = {\n  API_BASE_URL: "%s",\n};\n' \
            "$API_BASE_URL" > dist/config.js
      - name: Verify AWS credentials
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          echo "Checking AWS credentials..."

          test -n "$AWS_ACCESS_KEY_ID" && echo "Access key: OK" || exit 1
          test -n "$AWS_SECRET_ACCESS_KEY" && echo "Secret key: OK" || exit 1
          test -n "$AWS_SESSION_TOKEN" && echo "Session token: OK" || exit 1

          echo "All three credentials are available."      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy frontend to S3
        run: |
          aws s3 sync voting-frontend/dist s3://${{ vars.WEBSITE_BUCKET }} --delete

  deploy-backend:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: voting-backend/package-lock.json

      - name: Install production dependencies
        working-directory: voting-backend
        run: npm ci --omit=dev

      - name: Create backend deployment package
        working-directory: voting-backend
        run: |
          zip -r ../voting-backend.zip \
            src db scripts package.json package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Upload backend artifact to S3
        run: |
          aws s3 cp voting-backend.zip \
            s3://${{ vars.ARTIFACT_BUCKET }}/voting-backend.zip

      - name: Refresh backend Auto Scaling Group
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name voting-api-asg \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":180}'
