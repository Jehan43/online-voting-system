version: 0.2
 
phases:
  install:
    runtime-versions:
      nodejs: 20
  build:
    commands:
      - cd voting-frontend
      - npm ci
      - npm run build
      - >-
        printf "window.APP_CONFIG = {\n  API_BASE_URL: \"%s\",\n};\n"
        "$API_BASE_URL" > dist/config.js
  post_build:
    commands:
      - aws s3 sync dist s3://$voting-site-26mce006 --delete